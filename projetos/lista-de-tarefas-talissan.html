<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>Minha Rotina | Talissan Silva</title>
<style>
:root{--bg:#0b1220;--panel:#121d30;--panel2:#17243a;--text:#edf3ff;--muted:#9baac2;--accent:#7c9cff;--green:#65d6ad;--line:#293750}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0%,#1b2c4c 0,transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;padding:28px 16px}
main{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px}.eyebrow{color:var(--green);text-transform:uppercase;letter-spacing:.15em;font-size:.75rem;font-weight:800}.top h1{font-size:clamp(2rem,5vw,3.2rem);margin:8px 0}.sub{color:var(--muted);margin:0}.date{border:1px solid var(--line);border-radius:16px;padding:12px 16px;color:var(--muted);text-align:right;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat,.card{background:rgba(18,29,48,.92);border:1px solid var(--line);border-radius:20px;padding:18px}.stat span{color:var(--muted);font-size:.88rem}.stat strong{display:block;font-size:1.8rem;margin-top:5px}
.card{padding:22px}.card h2{margin:0 0 15px;font-size:1.15rem}.add{display:flex;gap:10px}.add input,.add select{min-width:0;background:#0c1525;border:1px solid var(--line);color:var(--text);padding:14px;border-radius:12px;font:inherit}.add input{flex:1}.add select{max-width:150px}.btn{border:0;background:var(--accent);color:#0b1220;font-weight:800;padding:13px 18px;border-radius:12px;cursor:pointer;font:inherit}.btn:hover{filter:brightness(1.08)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filter{background:transparent;color:var(--muted);border:1px solid var(--line);padding:8px 12px;border-radius:999px;cursor:pointer}.filter.active{background:#24365a;color:var(--text);border-color:#536da8}.task-list{display:grid;gap:10px}.task{display:flex;align-items:center;gap:12px;background:#0d1728;border:1px solid var(--line);padding:14px;border-radius:14px}.task input{width:19px;height:19px;accent-color:var(--green);flex-shrink:0}.task-content{flex:1;min-width:0}.task-title{overflow-wrap:anywhere}.task.done .task-title{text-decoration:line-through;color:#75849d}.tag{display:inline-block;font-size:.72rem;padding:4px 8px;border-radius:999px;margin-top:6px;background:#263654;color:#c8d6ff}.delete{background:transparent;border:1px solid var(--line);color:#ff9eaa;border-radius:9px;padding:7px 10px;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:28px 10px}.footer{color:var(--muted);font-size:.82rem;text-align:center;margin:20px 0}.progress{height:7px;background:#26344a;border-radius:20px;overflow:hidden;margin-top:12px}.progress div{height:100%;width:0;background:var(--green);transition:width .2s}
@media(max-width:620px){.top{align-items:flex-start;flex-direction:column}.date{text-align:left}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:1.4rem}.add{flex-wrap:wrap}.add input{flex-basis:100%}.add select{flex:1;max-width:none}.add .btn{flex:1}.card{padding:16px}}
</style>
</head>
<body>
<main>
  <header class="top">
    <div><div class="eyebrow">Organização pessoal</div><h1>Minha rotina<span style="color:var(--accent)">.</span></h1><p class="sub">Um passo de cada vez, um dia mais produtivo.</p></div>
    <div class="date" id="today"></div>
  </header>
  <section class="stats" aria-label="Resumo das tarefas">
    <div class="stat"><span>Tarefas no total</span><strong id="total">0</strong></div>
    <div class="stat"><span>Concluídas</span><strong id="completed">0</strong></div>
    <div class="stat"><span>Pendentes</span><strong id="pending">0</strong></div>
  </section>
  <section class="card">
    <h2>Adicionar tarefa</h2>
    <form class="add" id="taskForm">
      <input id="taskInput" type="text" maxlength="120" placeholder="Ex.: estudar JavaScript..." aria-label="Descrição da tarefa" required>
      <select id="category" aria-label="Categoria"><option>Geral</option><option>Estudos</option><option>Trabalho</option><option>Pessoal</option><option>Saúde</option></select>
      <button class="btn" type="submit">+ Adicionar</button>
    </form>
    <div class="filters" aria-label="Filtrar tarefas">
      <button class="filter active" data-filter="all">Todas</button><button class="filter" data-filter="pending">Pendentes</button><button class="filter" data-filter="done">Concluídas</button>
    </div>
    <div class="progress" aria-label="Progresso do dia"><div id="progressBar"></div></div>
    <div class="task-list" id="taskList" aria-live="polite"></div>
  </section>
  <p class="footer">Projeto desenvolvido por Talissan Luis da Silva · HTML, CSS e JavaScript</p>
</main>
<script>
const STORAGE_KEY='talissan-minha-rotina-v1';
let tasks=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
let filter='all';
const $=id=>document.getElementById(id);
$('today').textContent=new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(new Date());
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks));render()}
function render(){
 const done=tasks.filter(t=>t.done).length;
 $('total').textContent=tasks.length;$('completed').textContent=done;$('pending').textContent=tasks.length-done;
 $('progressBar').style.width=(tasks.length?done/tasks.length*100:0)+'%';
 const shown=tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done));
 $('taskList').innerHTML='';
 if(!shown.length){$('taskList').innerHTML='<div class="empty">'+(tasks.length?'Nenhuma tarefa neste filtro.':'Sua lista está vazia. Adicione a primeira tarefa acima!')+'</div>';return}
 shown.forEach(task=>{
  const item=document.createElement('div');item.className='task'+(task.done?' done':'');
  const check=document.createElement('input');check.type='checkbox';check.checked=task.done;check.setAttribute('aria-label','Marcar tarefa como concluída');check.addEventListener('change',()=>{task.done=check.checked;save()});
  const content=document.createElement('div');content.className='task-content';
  const title=document.createElement('div');title.className='task-title';title.textContent=task.title;
  const tag=document.createElement('span');tag.className='tag';tag.textContent=task.category;
  content.append(title,tag);
  const del=document.createElement('button');del.className='delete';del.textContent='Excluir';del.setAttribute('aria-label','Excluir '+task.title);del.addEventListener('click',()=>{tasks=tasks.filter(t=>t.id!==task.id);save()});
  item.append(check,content,del);$('taskList').append(item);
 });
}
$('taskForm').addEventListener('submit',e=>{e.preventDefault();const title=$('taskInput').value.trim();if(!title)return;tasks.unshift({id:Date.now(),title,category:$('category').value,done:false});$('taskInput').value='';save();$('taskInput').focus()});
document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{filter=btn.dataset.filter;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b===btn));render()}));
render();
</script>
</body>
</html>
